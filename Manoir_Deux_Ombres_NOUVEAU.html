<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Le Manoir des Deux Ombres — Escape game coopératif</title><style>
@import url('https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;700&family=DM+Sans:wght@400;500;600;700&display=swap');
:root{--gold:#dfbd7f;--ink:#0e1018;--paper:#e9dcc0;--muted:#acadae}*{box-sizing:border-box}body{margin:0;background:#090b11;color:#f3eee3;font-family:'DM Sans',sans-serif}button,input{font:inherit}button{cursor:pointer}button:focus-visible{outline:2px solid #f1cf8e;outline-offset:3px}.hidden{display:none!important}#app{min-height:100vh;background:radial-gradient(ellipse at 50% 0%,#272538,#090b11 75%)}.landing{min-height:100vh;display:grid;place-items:center;padding:30px}.land-inner{max-width:900px;width:100%;text-align:center}.eyebrow{letter-spacing:.35em;color:#d7b678;font-size:11px;text-transform:uppercase}.land-inner h1,.game-title{font-family:Cinzel,Georgia,serif;text-transform:uppercase;font-weight:600;letter-spacing:.06em}.land-inner h1{font-size:clamp(40px,7vw,76px);margin:16px 0 6px;line-height:1.1;text-shadow:0 4px 40px #000}.lead{color:#c5c3c7;line-height:1.75;max-width:660px;margin:22px auto}.roles{display:grid;grid-template-columns:1fr 1fr;gap:18px;margin:30px 0 18px}.role{background:linear-gradient(145deg,#262637,#141622);border:1px solid #6a5d52;border-radius:16px;padding:25px 20px;text-align:left;transition:.2s}.role:hover{border-color:#d6b373;transform:translateY(-3px)}.role h2{font-family:Cinzel;margin:5px 0 8px}.role p{font-size:14px;color:#c5c3c7;line-height:1.6}.role .emoji{font-size:40px}.primary{background:linear-gradient(135deg,#d8bd8e,#9f7944);color:#1f1810;border:none;border-radius:9px;font-weight:700;padding:13px 20px}.secondary{background:#272c39;border:1px solid #62616a;color:#f0e5d2;border-radius:9px;padding:10px 16px}.small{font-size:12px;color:#bbb9be}.header{max-width:1440px;margin:auto;display:flex;align-items:center;justify-content:space-between;gap:12px;padding:15px 26px}.brand{font-family:Cinzel;font-size:17px;color:var(--gold)}.header-right{display:flex;gap:14px;align-items:center;color:#c8c7ce;font-size:13px}.stage-label{padding:0 26px 14px;max-width:1440px;margin:auto;display:flex;gap:10px;align-items:center;flex-wrap:wrap}.pill{padding:6px 11px;border-radius:99px;border:1px solid #514b53;background:#191c27;color:#e4c995;font-size:12px}.game-layout{max-width:1440px;margin:0 auto;display:grid;grid-template-columns:minmax(0,1fr) 315px;gap:16px;padding:0 18px 20px}.scene-wrap{position:relative;aspect-ratio:16/9;min-height:360px;border:2px solid #66543d;border-radius:12px;overflow:hidden;background:#191724;box-shadow:0 20px 75px #0009}.scene-art{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}.scene-shade{position:absolute;inset:0;background:linear-gradient(0deg,#020409bd,transparent 37%,#07070a25)}.floor{position:absolute;inset:63% 2% 0;cursor:crosshair}.avatar{position:absolute;bottom:10%;left:17%;height:120px;width:62px;transform:translateX(-50%);transition:left 1.3s ease;filter:drop-shadow(4px 6px 5px #000b);pointer-events:none}.avatar .head{position:absolute;top:9px;left:16px;border-radius:50%;background:#d1ac88;width:32px;height:35px;box-shadow:inset 5px 0 #7e5c4c}.avatar .hair{position:absolute;top:1px;left:9px;width:47px;height:26px;background:#312223;border-radius:60% 60% 40% 40%}.avatar .body{position:absolute;top:47px;left:8px;background:linear-gradient(90deg,#181923,#515061 55%,#1d1c26);height:70px;width:49px;clip-path:polygon(20% 0%,80% 0%,100% 100%,0% 100%)}.avatar.blue .body{background:linear-gradient(90deg,#111f29,#48606b 55%,#1d2732)}.hotspot{position:absolute;transform:translate(-50%,-50%);background:#241d1acc;border:1.5px solid #edd29d;color:#f9e6be;border-radius:99px;padding:8px 12px;box-shadow:0 0 0 5px #edd29d19,0 4px 22px #000;white-space:nowrap;font-size:12px;transition:.2s}.hotspot:hover{background:#775536;transform:translate(-50%,-50%) scale(1.06)}.hotspot.visited{border-color:#83a294;color:#e1f7e4}.hotspot.door{font-weight:700;border:2px solid #f2c76b;background:#362717}.scene-caption{position:absolute;left:15px;top:14px;background:#0b0c13be;padding:11px 14px;border-left:3px solid #bfa06b;border-radius:5px;max-width:55%}.scene-caption strong{font-family:Cinzel;font-size:15px}.scene-caption p{margin:4px 0 0;font-size:12px;color:#ccc}.statusbar{position:absolute;bottom:12px;left:14px;right:14px;background:#0a0c11c4;border:1px solid #56515a;border-radius:8px;padding:9px 12px;font-size:12px;color:#ded6c6;pointer-events:none}.sidebar{display:flex;flex-direction:column;gap:13px}.panel{border:1px solid #514a46;border-radius:11px;background:linear-gradient(135deg,#1d202b,#11131b);padding:16px}.panel h3{margin:0 0 9px;font-family:Cinzel;color:#dfbd7f;font-size:15px}.panel p{font-size:13px;line-height:1.6;color:#d5d2ce;margin:5px 0}.journal{max-height:220px;overflow:auto}.journal p{border-bottom:1px solid #333541;padding-bottom:8px}.journal p:last-child{border:0}.actions{display:flex;gap:8px;flex-wrap:wrap}.actions button{font-size:12px}.progress{display:flex;gap:5px}.progress div{height:6px;border-radius:8px;flex:1;background:#3d3e4b}.progress .done{background:#d3af72}.modal-bg{position:fixed;inset:0;background:#01030ae9;z-index:20;display:grid;place-items:center;padding:20px}.modal{position:relative;max-width:600px;width:100%;background:linear-gradient(140deg,#29232b,#151922);border:1px solid #bd9d6c;box-shadow:0 20px 100px #000;border-radius:14px;padding:30px;max-height:90vh;overflow:auto}.modal h2{font-family:Cinzel;color:#f2d5a1;margin:0 30px 15px 0}.modal p{line-height:1.75;color:#ded7cb}.close{position:absolute;right:13px;top:10px;background:transparent;color:white;border:0;font-size:25px}.clue-paper{background:#e7d9b6;color:#2b251d;padding:20px;border-radius:4px;box-shadow:inset 0 0 28px #a57e4d65;white-space:pre-line;font-family:Georgia,serif;line-height:1.8;margin:15px 0}.code-row{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-top:15px}.code-row input{letter-spacing:.2em;text-transform:uppercase;width:170px;padding:12px;background:#0b0f18;color:white;border:1px solid #80725d;border-radius:6px;font-size:19px}.msg{font-size:13px;min-height:23px;color:#f1c788}.mini-note{background:#222936;border:1px dashed #786c5c;padding:12px;border-radius:7px;font-size:13px;color:#decda9;margin-top:13px}.ending{text-align:center;max-width:750px}.ending h1{font-family:Cinzel;color:#eac78e;font-size:45px}.ending p{color:#d2ccd0;line-height:1.8}.timer{font-variant-numeric:tabular-nums}.instructions{text-align:left;max-width:620px;margin:20px auto;color:#d0c7c3;line-height:1.8;border-top:1px solid #514b53;padding-top:16px}.instructions strong{color:#edca8c}@media(max-width:950px){.game-layout{grid-template-columns:1fr}.sidebar{display:grid;grid-template-columns:1fr 1fr}.scene-wrap{min-height:310px}}@media(max-width:650px){.roles,.sidebar{grid-template-columns:1fr}.scene-wrap{aspect-ratio:4/3;min-height:300px}.hotspot{padding:7px 8px;font-size:10px}.scene-caption{max-width:72%}.avatar{height:100px;transform:translateX(-50%) scale(.8)}.header{padding:12px}.stage-label{padding:0 12px 10px}.game-layout{padding:0 8px 12px}.brand{font-size:13px}}
</style></head><body><div id="app"></div><script>
const app=document.getElementById('app');
const chapters=[
{room:'Le vestibule',subtitle:'Deux ailes. Une seule issue.',story:'La porte d’entrée vient de se verrouiller. Vous êtes séparés par une grille de fer. Il faut rétablir le courant dans les deux ailes.',objects:['Portrait poussiéreux','Plaque de cuivre','Coffre à mécanisme'],positions:[[26,42],[68,40],[46,69]],symbolA:'☽ ◆ ♠',symbolB:'♣ ★ ☀',mapA:'♣ = 8   ★ = 2   ☀ = 5',mapB:'☽ = 4   ◆ = 7   ♠ = 1',answerA:'471',answerB:'825',noteA:'Le portrait cache un vieux plan. En dessous, un message : « Le code du coffre de ton partenaire se lit de gauche à droite. »',noteB:'Une gravure rappelle que les symboles doivent être lus dans l’ordre indiqué sur la serrure.',lockTitle:'Tableau électrique',success:'Les lampes s’allument dans un crépitement. Deux escaliers apparaissent derrière les tentures.'},
{room:'La bibliothèque interdite',subtitle:'Les ouvrages mentent. Les horloges non.',story:'Vous explorez chacun une salle de lecture. Les bibliothécaires ont mélangé leurs archives : vous devez retrouver le registre des passages.',objects:['Grand livre','Horloge arrêtée','Serrure de la réserve'],positions:[[27,59],[70,36],[50,71]],symbolA:'△ ○ □ ☆',symbolB:'◇ ☾ ♧ ♡',mapA:'◇ = 6   ☾ = 1   ♧ = 9   ♡ = 3',mapB:'△ = 2   ○ = 8   □ = 4   ☆ = 7',answerA:'2847',answerB:'6193',noteA:'Un passage du registre : « Les reliures d’or indiquent les caractères utiles ; les autres sont des leurres. »',noteB:'Dans les marges : « Le premier symbole vaut le premier chiffre ; ne changez jamais l’ordre. »',lockTitle:'Serrure de la réserve',success:'Une étagère pivote lentement et révèle un passage derrière les livres.'},
{room:'La galerie des miroirs',subtitle:'Chaque reflet dissimule une moitié de la vérité.',story:'Les couloirs convergent vers deux galeries jumelles. Dans l’une, des étoiles ; dans l’autre, des lettres tracées à la craie.',objects:['Miroir fissuré','Tableau astral','Porte à cadran'],positions:[[27,42],[68,42],[50,72]],symbolA:'♟ ✦ ☯ ☘',symbolB:'☀ ♜ ☂ ♢',mapA:'☀ = 3   ♜ = 5   ☂ = 0   ♢ = 8',mapB:'♟ = 9   ✦ = 2   ☯ = 6   ☘ = 4',answerA:'9264',answerB:'3508',noteA:'Sous le miroir : « Un reflet peut être trompeur, mais l’ordre des signes, lui, ne change pas. »',noteB:'Un détail du tableau astral : « Un zéro est aussi une réponse. »',lockTitle:'Porte à cadran',success:'Les miroirs s’ouvrent en silence sur un escalier qui descend sous le manoir.'},
{room:'La crypte',subtitle:'Un pacte à deux voix.',story:'Un grimoire vous attend dans chaque aile de la crypte. La famille du manoir a laissé un dernier dispositif : le sceau ne cèdera qu’avec vos deux codes.',objects:['Autel des ombres','Grimoire scellé','Sceau de sortie'],positions:[[28,55],[66,43],[51,73]],symbolA:'⚘ ☼ ◆ ♣',symbolB:'☾ ♠ ★ ♢',mapA:'☾ = 7   ♠ = 3   ★ = 8   ♢ = 2',mapB:'⚘ = 5   ☼ = 1   ◆ = 0   ♣ = 6',answerA:'5106',answerB:'7382',noteA:'Sur l’autel : « Deux voix font tomber le dernier verrou. »',noteB:'Sur une dalle : « La liberté exige une ultime coopération. »',lockTitle:'Sceau de sortie',success:'Le sceau se brise. Une lumière pâle dessine enfin la sortie du manoir.'}
];
let role=null,chapter=0,visited=new Set(),journal=[],secs=0,tick=null,pop=null,pos=17,finished=false;
function svgScene(n){let palettes=[['#252d43','#463a34','#11121b'],['#252b39','#4d392a','#14111a'],['#263044','#43374a','#14101b'],['#192736','#3b3438','#10121b']];let [a,b,c]=palettes[n];let decor='';if(n===0){decor=`<rect x="90" y="100" width="145" height="225" fill="#413931" stroke="#93764b" stroke-width="9"/><rect x="104" y="113" width="119" height="197" fill="#151b2a"/><path d="M150 170q22-50 44 0v75h-44z" fill="#7c675c"/><ellipse cx="174" cy="144" rx="17" ry="22" fill="#bf9b81"/><rect x="713" y="90" width="130" height="275" fill="#24202b" stroke="#977a55" stroke-width="10"/><path d="M729 348V187Q779 118 826 187V348Z" fill="#10141f" stroke="#665746" stroke-width="5"/><path d="M764 184v166m25-185v185" stroke="#917047" stroke-width="5"/>`;}else if(n===1){decor=`<g fill="#4c3429" stroke="#b38d5c" stroke-width="6"><rect x="80" y="75" width="260" height="270"/><rect x="610" y="75" width="260" height="270"/></g>${[0,1,2,3].map(i=>`<g>${Array.from({length:9},(_,j)=>`<rect x="${92+(i<2?0:530)+(j%3)*68}" y="${90+Math.floor(j/3)*80}" width="48" height="62" fill="${['#62504b','#353f52','#675543'][j%3]}" stroke="#b19b76" stroke-width="3"/>`).join('')}</g>`).slice(0,1400)}<circle cx="480" cy="139" r="65" fill="#d6bb88" stroke="#584232" stroke-width="13"/><path d="M480 139v-43m0 43l26 15" stroke="#3a2d28" stroke-width="5"/>`;}else if(n===2){decor=`<rect x="90" y="93" width="225" height="270" fill="#131a27" stroke="#a78c72" stroke-width="12"/><rect x="655" y="93" width="225" height="270" fill="#151e30" stroke="#a78c72" stroke-width="12"/><path d="M112 120l175 220M280 125L125 335M680 123l172 215M840 123L680 335" stroke="#b2c4df" opacity=".3" stroke-width="9"/><circle cx="480" cy="162" r="92" fill="#18212a" stroke="#9d855f" stroke-width="11"/>${Array.from({length:11},(_,i)=>`<circle cx="${480+70*Math.cos(i*.571)}" cy="${162+69*Math.sin(i*.571)}" r="3" fill="#e4d1a5"/>`).join('')}`;}else{decor=`<path d="M110 370V180Q180 60 250 180V370M710 370V180Q780 60 850 180V370" fill="#141a20" stroke="#635e58" stroke-width="14"/><path d="M140 350v-175m80 175v-175M740 350v-175m80 175v-175" stroke="#423c43" stroke-width="8"/><ellipse cx="480" cy="330" rx="160" ry="55" fill="#54413d" stroke="#b89a67" stroke-width="10"/><path d="M460 315q20-70 42 0" fill="none" stroke="#dbb979" stroke-width="8"/>`;}return `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" preserveAspectRatio="xMidYMid slice"><defs><radialGradient id="g"><stop stop-color="${b}"/><stop offset="1" stop-color="${c}"/></radialGradient><linearGradient id="fl" x2="0" y2="1"><stop stop-color="#5c4b42"/><stop offset="1" stop-color="#14161d"/></linearGradient></defs><rect width="960" height="540" fill="url(#g)"/><path d="M0 0H960L870 380H90Z" fill="${a}" opacity=".5"/><path d="M0 380H960V540H0Z" fill="url(#fl)"/><path d="M90 380L0 540m780-160 180 160M0 460h960" stroke="#7d6654" opacity=".28" stroke-width="4"/><path d="M0 0L90 380M960 0L870 380" stroke="#a28b72" stroke-width="19" opacity=".4"/><path d="M380 0v340M580 0v340" stroke="#554843" stroke-width="7" opacity=".4"/>${decor}<path d="M0 0h960v540H0z" fill="#000" opacity=".09"/></svg>`}
function init(r){role=r;chapter=0;secs=0;finished=false;visited=new Set();journal=['Vous vous réveillez dans une aile différente du manoir. Vous pouvez vous parler, mais pas vous rejoindre.'];render();if(tick)clearInterval(tick);tick=setInterval(()=>{secs++;let t=document.getElementById('timer');if(t)t.textContent=time()},1000)}
function time(){return `${String(Math.floor(secs/60)).padStart(2,'0')}:${String(secs%60).padStart(2,'0')}`}
function render(){if(!role){app.innerHTML=`<div class="landing"><div class="land-inner"><div class="eyebrow">Escape game coopératif · Deux ordinateurs</div><h1>Le Manoir<br>des Deux Ombres</h1><p class="lead">Minuit. La grille claque derrière vous. Deux personnages se retrouvent enfermés dans des ailes opposées d'un manoir abandonné. <b>Chacun voit ce que l'autre ne peut pas voir.</b> Communiquez pour déverrouiller les portes et vous échapper ensemble.</p><div class="roles"><button class="role" onclick="init('A')"><span class="emoji">🕯️</span><h2>Élise · Aile Ouest</h2><p>Explore les tableaux, les manuscrits et les mécanismes. Choisis ce rôle sur le premier ordinateur.</p><span style="color:var(--gold)">Incarner Élise →</span></button><button class="role" onclick="init('B')"><span class="emoji">🗝️</span><h2>Gabriel · Aile Est</h2><p>Explore les horloges, les symboles et les coffres. Choisis ce rôle sur le second ordinateur.</p><span style="color:var(--gold)">Incarner Gabriel →</span></button></div><div class="instructions"><strong>Comment jouer :</strong> ouvrez ce même lien chacun sur votre Mac, choisissez un rôle différent, puis parlez-vous en appel ou côte à côte. Cliquez sur les objets du décor pour fouiller, collectez les indices et communiquez les informations utiles. Les deux écrans ne sont pas synchronisés : chacun valide son cadenas. <b>Durée indicative : 20 à 35 min selon votre expérience.</b></div><p class="small">En français · 2 joueurs · 4 salles · 8 cadenas interdépendants · Sans installation · Aucune inscription</p></div></div>`;return}if(finished){app.innerHTML=`<div class="landing"><div class="ending"><div class="eyebrow">Mission accomplie</div><h1>Vous êtes libres !</h1><p>Lorsque la dernière porte s'ouvre, Élise et Gabriel se retrouvent enfin dans le jardin. Derrière eux, le manoir s'éteint, pièce par pièce. Vous avez réussi grâce à votre communication et votre sang-froid.</p><p>Temps sur cet ordinateur : <b>${time()}</b></p><button class="primary" onclick="location.reload()">Rejouer l'aventure</button></div></div>`;return}
let ch=chapters[chapter],me=role==='A'?'Élise':'Gabriel';app.innerHTML=`<div class="header"><div class="brand">☽ LE MANOIR DES DEUX OMBRES</div><div class="header-right"><span>Personnage : <b>${me}</b></span><span class="timer" id="timer">${time()}</span></div></div><div class="stage-label"><span class="pill">Salle ${chapter+1} / 4</span><span class="pill">${role==='A'?'Aile Ouest':'Aile Est'}</span><div class="progress" style="width:130px">${chapters.map((_,i)=>`<div class="${i<=chapter?'done':''}"></div>`).join('')}</div></div><div class="game-layout"><div class="scene-wrap"><div class="scene-art">${svgScene(chapter)}</div><div class="scene-shade"></div><div class="scene-caption"><strong>${ch.room}</strong><p>${ch.subtitle}</p></div><div class="floor" onclick="move(event)"></div>${ch.objects.map((o,i)=>`<button class="hotspot ${i===2?'door':''} ${visited.has(i)?'visited':''}" style="left:${ch.positions[i][0]}%;top:${ch.positions[i][1]}%" onclick="inspect(${i})">${['✦','◈','🔒'][i]} ${o}</button>`).join('')}<div class="avatar ${role==='B'?'blue':''}" id="avatar" style="left:${pos}%"><div class="hair"></div><div class="head"></div><div class="body"></div></div><div class="statusbar">Clique sur les objets lumineux pour enquêter. Clique sur le sol pour déplacer ton personnage.</div></div><div class="sidebar"><div class="panel"><h3>✧ Votre mission</h3><p>${ch.story}</p><p><b>Objectif :</b> fouiller la salle, partager les indices et ouvrir votre verrou.</p></div><div class="panel journal"><h3>📜 Carnet d'enquête</h3>${journal.slice(-7).reverse().map(x=>`<p>${escapeText(x)}</p>`).join('')}</div><div class="panel"><h3>⚙️ Commandes</h3><div class="actions"><button class="secondary" onclick="showHelp()">Indice</button><button class="secondary" onclick="showRules()">Règles</button><button class="secondary" onclick="restart()">Recommencer</button></div></div></div></div><div id="overlay"></div>`}
function escapeText(s){return String(s).replace(/[&<>"']/g,x=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[x]))}function move(e){const rect=e.currentTarget.getBoundingClientRect();pos=Math.max(9,Math.min(90,((e.clientX-rect.left)/rect.width)*100));document.getElementById('avatar').style.left=pos+'%'}
function journalAdd(s){if(!journal.includes(s))journal.push(s)}
function inspect(i){visited.add(i);let ch=chapters[chapter];if(i===0){journalAdd(ch.noteA);modal('Un indice dans la poussière',`<p>${escapeText(ch.noteA)}</p><div class="mini-note">Sur un morceau de papier, tu découvres : <b>« Le message utile pour ton partenaire se trouve sur la plaque / l'horloge / le tableau. »</b></div>`)}else if(i===1){let code=role==='A'?ch.mapA:ch.mapB;journalAdd('Clé de décodage destinée à mon partenaire : '+code);modal('Le document retrouvé',`<p>Tu découvres une table de correspondance. <b>Elle ne sert PAS à ouvrir ton propre cadenas : transmets-la à l'autre joueur.</b></p><div class="clue-paper">${escapeText(code.replace(/   /g,'\n'))}</div><p>Dicte chaque symbole et son chiffre à ton partenaire. Il en a besoin pour avancer.</p>`)}else{const symbols=role==='A'?ch.symbolA:ch.symbolB;modal(ch.lockTitle,`<p>Ton verrou montre ces symboles, dans cet ordre :</p><div class="clue-paper" style="font-size:28px;text-align:center;letter-spacing:.3em">${escapeText(symbols)}</div><p><b>Demande à ton partenaire sa table de correspondance</b> pour transformer les symboles en chiffres.</p><form onsubmit="unlock(event)"><div class="code-row"><input aria-label="Code de la serrure" id="lockCode" maxlength="4" inputmode="numeric" pattern="[0-9]{3,4}" placeholder="Code" autocomplete="off" required><button class="primary" type="submit">Ouvrir</button></div><div class="msg" id="codeMsg"></div></form><p class="small">Le code contient ${ch.answerA.length} chiffres. Il n'y a pas de pénalité en cas d'erreur.</p>`)}renderBackground()}
function renderBackground(){let slots=document.querySelectorAll('.hotspot');slots.forEach((el,i)=>el.classList.toggle('visited',visited.has(i)));let panel=document.querySelector('.journal');if(panel)panel.innerHTML='<h3>📜 Carnet d\'enquête</h3>'+journal.slice(-7).reverse().map(x=>`<p>${escapeText(x)}</p>`).join('')}
function modal(title,html){document.getElementById('overlay').innerHTML=`<div class="modal-bg" onclick="if(event.target===this)closeModal()"><div class="modal"><button class="close" aria-label="Fermer" onclick="closeModal()">×</button><h2>${title}</h2>${html}</div></div>`}function closeModal(){document.getElementById('overlay').innerHTML=''}
function unlock(ev){ev.preventDefault();let val=document.getElementById('lockCode').value.trim(),answer=role==='A'?chapters[chapter].answerA:chapters[chapter].answerB;if(val!==answer){document.getElementById('codeMsg').textContent='Ce code ne fonctionne pas. Vérifie les symboles avec ton partenaire.';return}let text=chapters[chapter].success;modal('🔓 Le verrou cède !',`<p>${text}</p><p><b>Annonce à ton partenaire que ta porte est ouverte.</b> Vous pouvez continuer dès que chacun a déverrouillé son côté.</p><button class="primary" onclick="nextChapter()">${chapter===3?'Sortir du manoir':'Explorer la salle suivante'} →</button>`)}
function nextChapter(){chapter++;visited=new Set();journal=['Une nouvelle salle se dévoile. Chacun explore son côté et rassemble ses indices.'];pos=17;if(chapter>=chapters.length){finished=true;if(tick)clearInterval(tick)}render()}
function showHelp(){modal('Indice du gardien',`<p>Dans cette salle, ton propre cadenas indique <b>une suite de symboles</b>. La correspondance symbole → chiffre est sur l'écran de ton partenaire.</p><p>De ton côté, fouille l'objet central pour trouver la table qui aidera <b>l'autre joueur</b>. Dictez-vous les informations à voix haute.</p><div class="mini-note">Pour avancer : inspectez l'objet de gauche, puis celui de droite, puis le cadenas. Transformez les symboles dans l'ordre, sans les inverser.</div>`)}function showRules(){modal('Comment jouer à deux',`<p>1. Toi et ton partenaire ouvrez ce site sur deux ordinateurs et choisissez <b>des rôles différents</b>.</p><p>2. Vous pouvez vous déplacer en cliquant au sol et fouiller chaque objet.</p><p>3. Chaque personnage découvre une partie des informations. <b>Parlez-vous pour ouvrir les verrous.</b></p><p>4. Quand vous avez tous les deux ouvert votre porte, cliquez chacun sur « Salle suivante ».</p><p>Attention : il s'agit d'un jeu coopératif <b>sans synchronisation en temps réel</b>. Les objets ne bougent pas automatiquement sur l'écran de l'autre.</p>`)}function restart(){if(confirm('Recommencer depuis le début ?')){if(tick)clearInterval(tick);role=null;chapter=0;render()}}render();
</script></body></html>
