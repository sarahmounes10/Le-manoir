<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>LE MANOIR — Les Deux Ombres</title><style>
@import url('https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Playfair+Display:wght@500;600;700&display=swap');
:root{--bg:#0b0e10;--panel:#14191b;--line:#35403e;--text:#eee8d9;--dim:#a5ada9;--accent:#b1a17a;--red:#ac594d}*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;color:var(--text);background:var(--bg);font-family:'DM Sans',sans-serif}button,input{font:inherit}button{cursor:pointer}button:focus-visible,input:focus-visible{outline:2px solid #ddbf7a;outline-offset:3px}button:disabled{opacity:.35;cursor:not-allowed}.hide{display:none!important}#app{min-height:100vh}.hero{min-height:100vh;background:radial-gradient(ellipse at 50% 18%,#2c3537 0,#0b0e10 65%);display:grid;place-items:center;padding:35px 18px}.hero-inner{max-width:1000px;width:100%;text-align:center}.overline{font-size:11px;font-weight:700;letter-spacing:.3em;text-transform:uppercase;color:var(--accent)}h1,h2,h3{font-family:'Playfair Display',Georgia,serif}.hero h1{font-size:clamp(48px,7vw,96px);line-height:.96;font-weight:500;letter-spacing:-.035em;margin:18px 0 22px}.intro{line-height:1.9;color:#c2c6bf;max-width:690px;margin:0 auto 26px}.choice{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-top:28px}.role{border:1px solid #4d514a;color:var(--text);text-align:left;border-radius:2px;background:linear-gradient(145deg,#222c2d,#111717);padding:28px;transition:transform .2s,border-color .2s;min-height:178px}.role:hover{border-color:#ccb480;transform:translateY(-3px)}.role .mono{font-size:10px;letter-spacing:.3em;color:var(--accent)}.role h2{font-size:28px;font-weight:500;margin:12px 0}.role p{color:#b6bfb8;line-height:1.6;margin:0;font-size:13px}.instruction{border-top:1px solid #3f4944;margin-top:28px;padding-top:20px;font-size:13px;color:#b4bdb7;line-height:1.75}.toolbar{padding:13px max(18px,calc((100vw - 1540px)/2));display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:12px;border-bottom:1px solid #343f3d;background:#101516}.brand{font-family:'Playfair Display',serif;letter-spacing:.02em;font-size:22px}.brand span{color:var(--accent)}.tabs{display:flex;gap:10px;align-items:center;flex-wrap:wrap}.tab{border:1px solid #53615b;background:transparent;color:#dfded6;padding:10px 12px;border-radius:3px;font-size:12px}.tab:hover{background:#20292a}.role-id{font-size:10px;letter-spacing:.12em;color:var(--accent)}.layout{max-width:1540px;margin:auto;padding:18px;display:grid;grid-template-columns:minmax(0,1fr) 310px;gap:18px}.topline{display:flex;align-items:end;justify-content:space-between;margin-bottom:12px;gap:8px}.topline h2{margin:0;font-size:29px;font-weight:500}.topline small{font-size:11px;letter-spacing:.16em;color:var(--accent)}.room{position:relative;overflow:hidden;border:1px solid #536056;aspect-ratio:16/9;min-height:390px;background:#111718;box-shadow:0 24px 65px #0008}.room svg{display:block;width:100%;height:100%;position:absolute;inset:0}.room:after{content:"";position:absolute;inset:0;pointer-events:none;box-shadow:inset 0 0 85px 38px #000b}.room-title{position:absolute;z-index:2;top:18px;left:20px;padding:10px 14px;background:#080d0db8;border-left:2px solid #d0b686;font-size:12px;letter-spacing:.07em}.hot{position:absolute;z-index:4;transform:translate(-50%,-50%);background:#0c1515e8;border:1px solid #baab89;border-radius:4px;color:#fff3d6;padding:10px 13px;min-width:100px;max-width:165px;font-size:12px;box-shadow:0 0 0 5px #0006,0 0 27px #a48a5433}.hot:hover{background:#344240;border-color:#f3d796}.hot.seen{border-color:#86a297;color:#e4f0e6}.hot.lock{background:#463a2bdc;border-color:#e9d29c}.bottom-prompt{position:absolute;z-index:5;left:18px;bottom:17px;right:18px;background:#0c1111cf;padding:11px;border:1px solid #414e49;font-size:12px;color:#d0d4cd}.track{display:flex;gap:6px;margin:13px 0 15px}.track div{flex:1;height:5px;background:#36403b}.track div.past{background:#9c936f}.track div.current{background:#e0c38d}.aside{display:flex;flex-direction:column;gap:14px}.panel{background:linear-gradient(150deg,#1a2222,#111717);border:1px solid #34403b;padding:18px}.panel h3{font-size:20px;font-weight:500;margin:0 0 10px}.panel p{color:#bbc1ba;font-size:12px;line-height:1.8}.paper{background:#e8dcc2;color:#28251f;border-radius:2px;padding:21px;font-family:Georgia,serif;line-height:1.8;white-space:pre-wrap;box-shadow:inset 0 0 28px #bc9a6552;font-size:17px;margin:15px 0;overflow-wrap:anywhere}.paper.dark{background:#263031;color:#e4deca;box-shadow:none;border:1px solid #637069}.label{font-size:11px;letter-spacing:.15em;color:var(--accent);text-transform:uppercase}.modal-overlay{position:fixed;z-index:30;inset:0;background:#030606e8;display:grid;place-items:center;padding:18px}.modal{width:min(640px,100%);background:#151d1d;border:1px solid #8e876d;padding:clamp(19px,4vw,35px);max-height:90vh;overflow:auto;box-shadow:0 18px 100px #000;position:relative}.modal h2{font-size:32px;font-weight:500;margin:5px 38px 14px 0}.modal p{font-size:14px;color:#d1d1c6;line-height:1.8}.close{position:absolute;right:16px;top:10px;background:transparent;border:0;color:#e2daca;font-size:29px}.primary{background:#c5ad7d;color:#141916;border:1px solid #d9c18d;padding:12px 17px;font-weight:700;border-radius:2px}.primary:hover{background:#e6cd9a}.ghost{border:1px solid #617069;background:#222c2b;color:#f0e9d9;padding:11px 14px;border-radius:2px}.inline-controls{display:flex;flex-wrap:wrap;gap:9px}.input{background:#080f10;color:#eee;border:1px solid #737b6f;padding:12px;font-size:20px;letter-spacing:.2em;width:min(220px,100%);text-transform:uppercase}.feedback{min-height:20px;font-size:13px;color:#dfb3a9;margin:10px 0}.notelist{padding-left:16px;font-size:12px;line-height:1.9;color:#cdd3c9}.notelist li{padding-bottom:6px}.badge{display:inline-flex;background:#263029;color:#e6d29f;padding:6px 10px;font-size:11px;letter-spacing:.04em;border:1px solid #616a51}.end h1{font-size:55px}.timeline{font-size:12px;color:#a7b3a9}.endstats{font-size:17px;color:#d6c28f}@media(max-width:960px){.layout{grid-template-columns:1fr}.aside{display:grid;grid-template-columns:1fr 1fr}.room{min-height:360px}}@media(max-width:620px){.choice,.aside{grid-template-columns:1fr}.layout{padding:8px}.room{min-height:355px;aspect-ratio:4/3}.hot{font-size:10px;min-width:77px;padding:8px}.topline h2{font-size:23px}.toolbar{padding:12px}.room-title{font-size:10px}}
</style></head><body><div id="app"></div><script>
'use strict';
const scenes=[
{title:'Le vestibule des disparus',short:'LES PORTRAITS',sub:'Les ancêtres ont laissé une chronologie qui ne suit aucune logique apparente.',A:{door:'Un coffre à quatre portraits',lock:'Quatre cadres portent ces inscriptions :\nLucien — 1681\nVictor — 1694\nAnne — 1702\nIris — 1715\n\nLe clavier exige quatre chiffres. Dans quel ordre regarder les cadres et quels chiffres choisir ?',aid:'Pierrick a trouvé dans l’autre aile une instruction concernant les années.',answer:'1425',help:'Classe les années de la plus ancienne à la plus récente, puis récupère leur chiffre des unités.',artifact:'3'},B:{door:'Le mécanisme des quatre leviers',lock:'Quatre leviers portent les inscriptions :\nA = III\nB = VIII\nC = V\nD = I\n\nLe mécanisme réclame trois chiffres, mais les leviers ne peuvent pas être actionnés directement.',aid:'Élise détient une formule écrite derrière son portrait.',answer:'348',help:'Calcule B − C, puis D + A, puis A + C. Résultat : 3, 4, 8.',artifact:'7'},clueA:'À TRANSMETTRE À GABRIEL\n\nLa formule des leviers est :\n(B − C) | (D + A) | (A + C)\n\nLes lettres désignent les valeurs gravées sur les leviers. Chaque résultat donne un chiffre.',clueB:'À TRANSMETTRE À ÉLISE\n\nLes quatre portraits doivent être classés du PLUS ANCIEN au PLUS RÉCENT.\n\nPrends le chiffre des UNITÉS de chaque année dans cet ordre.',story:'Une grille vous sépare. Les voix passent entre les barreaux, mais aucun objet ne peut traverser.',win:'Deux verrous résonnent à travers le vestibule. Un escalier caché s’illumine.'},
{title:'Le cabinet des messages',short:'LES CRYPTOGRAMMES',sub:'Deux notes chiffrées. Deux méthodes de décalage différentes.',A:{door:'Le tiroir des constellations',lock:'Sur le tiroir, une inscription en lettres :\n\nO X Q H\n\nUne lune gravée est dessinée à côté. Il faut entrer le mot déchiffré.',aid:'Gabriel possède la règle exacte du décalage pour la lune.',answer:'LUNE',help:'Recule chaque lettre de trois places dans l’alphabet : O→L, X→U, Q→N, H→E.',artifact:'8'},B:{door:'Le pupitre solaire',lock:'Une bande de papier est coincée dans le pupitre :\n\nX T Q J N Q\n\nÀ côté se trouve un soleil doré. Le clavier accepte un mot.',aid:'Élise possède la règle exacte du décalage pour le soleil.',answer:'SOLEIL',help:'Recule chaque lettre de cinq places : X→S, T→O, Q→L, J→E, N→I, Q→L.',artifact:'2'},clueA:'À TRANSMETTRE À GABRIEL\n\nLa clé du SOLEIL recule chaque lettre chiffrée de CINQ places dans l’alphabet.\n\nAprès A, on revient à Z.',clueB:'À TRANSMETTRE À ÉLISE\n\nLa clé de la LUNE recule chaque lettre chiffrée de TROIS places dans l’alphabet.\n\nAprès A, on revient à Z.',story:'Vous entendez un tic-tac à travers les murs. Les messages semblent avoir été écrits par deux prisonniers.',win:'Les tiroirs s’ouvrent. À l’intérieur, une ancienne carte indique deux ailes souterraines.'},
{title:'Le labyrinthe des couloirs',short:'LES ITINÉRAIRES',sub:'Pour ne pas tomber dans les pièges, vous devez suivre les instructions de l’autre.',A:{door:'La serrure du couloir ouest',lock:'La carte gravée au mur montre :\n\n       NORD = 2\nOUEST = 1       EST = 7\n       SUD = 4\n\nUne serrure attend une suite de quatre directions, converties en chiffres.',aid:'Gabriel a la feuille de route pour ton couloir.',answer:'2741',help:'Gabriel doit te dicter Nord → Est → Sud → Ouest, donc 2 7 4 1.',artifact:'1'},B:{door:'La serrure du couloir est',lock:'La carte du couloir est indique :\n\n       NORD = 8\nOUEST = 6       EST = 3\n       SUD = 5\n\nLa serrure exige une suite de quatre directions converties en chiffres.',aid:'Élise possède la route qui évite les dalles piégées.',answer:'5836',help:'Élise doit te dicter Sud → Nord → Est → Ouest, donc 5 8 3 6.',artifact:'9'},clueA:'À TRANSMETTRE À GABRIEL\n\nPour éviter les dalles piégées dans l’aile EST, traverse les points cardinaux dans cet ordre :\n\nSUD → NORD → EST → OUEST\n\nChaque direction doit être transformée en chiffre grâce à SA carte.',clueB:'À TRANSMETTRE À ÉLISE\n\nPour éviter les dalles piégées dans l’aile OUEST, traverse les points cardinaux dans cet ordre :\n\nNORD → EST → SUD → OUEST\n\nChaque direction doit être transformée en chiffre grâce à SA carte.',story:'Les couloirs se ressemblent tous, mais seuls deux itinéraires permettent d’éviter les dalles instables.',win:'Les pierres cessent de vibrer. Une porte blindée conduit à la salle des interrogatoires.'},
{title:'Le salon des faux témoins',short:'LES DÉDUCTIONS',sub:'Des témoignages contradictoires vous rapprochent du secret de la famille.',A:{door:'Le registre du coupable',lock:'Quatre personnes figurent dans le registre :\nROSE — jardinière, arrivée à 21 h\nMARC — majordome, arrivé à 22 h\nELSA — musicienne, arrivée à 20 h\nPAUL — médecin, arrivé à 23 h\n\nLa serrure demande le prénom de la personne recherchée.',aid:'Gabriel a obtenu le témoignage permettant d’identifier cette personne.',answer:'ROSE',help:'La personne recherchée travaillait dehors et est arrivée avant 22 h. Seule ROSE correspond.',artifact:'6'},B:{door:'L’armoire des interrupteurs',lock:'L’armoire porte quatre interrupteurs numérotés 1, 2, 3, 4.\n\nValeurs :\n1 = 6\n2 = 3\n3 = 1\n4 = 2\n\nLe clavier attend quatre chiffres, mais l’ordre des interrupteurs a été changé.',aid:'Élise peut lire l’ordre des interrupteurs dans un carnet caché.',answer:'6312',help:'Le carnet d’Élise donne l’ordre 1 → 2 → 3 → 4 : écris leurs valeurs 6 3 1 2.',artifact:'4'},clueA:'À TRANSMETTRE À GABRIEL\n\nLa séquence de réactivation est :\n1 → 2 → 3 → 4\n\nLis les valeurs des interrupteurs dans cet ordre. Ne confonds pas numéro et valeur.',clueB:'À TRANSMETTRE À ÉLISE\n\nLe coupable recherché :\n• travaillait à l’EXTÉRIEUR du manoir ;\n• est arrivé AVANT 22 h.\n\nCes deux conditions doivent être vraies.',story:'Le salon garde le souvenir d’une disparition. Tout le monde ment, sauf les faits consignés dans les archives.',win:'Une plaque de marbre coulisse. Au-dessous, vous découvrez la porte qui mène à la crypte.'},
{title:'La crypte du pacte',short:'LA DERNIÈRE PORTE',sub:'Les preuves de votre parcours deviennent la seule issue.',A:{door:'Le sceau de l’aile ouest',lock:'Le sceau exige QUATRE chiffres.\n\nTon partenaire a reçu UN chiffre à chaque salle précédente. Il doit te les dicter DANS L’ORDRE du parcours :\n1. Vestibule\n2. Cabinet\n3. Labyrinthe\n4. Salon',aid:'Gabriel doit consulter les quatre preuves de son inventaire. Ce sont ses chiffres, pas les tiens.',answer:'7294',help:'Gabriel a récolté 7 puis 2 puis 9 puis 4. La suite est 7294.',artifact:'✦'},B:{door:'Le sceau de l’aile est',lock:'Le sceau exige QUATRE chiffres.\n\nTon partenaire a reçu UN chiffre à chaque salle précédente. Il doit te les dicter DANS L’ORDRE du parcours :\n1. Vestibule\n2. Cabinet\n3. Labyrinthe\n4. Salon',aid:'Élise doit consulter les quatre preuves de son inventaire. Ce sont ses chiffres, pas les tiens.',answer:'3816',help:'Élise a récolté 3 puis 8 puis 1 puis 6. La suite est 3816.',artifact:'✦'},clueA:'LE DERNIER PACTE\n\nLe sceau de Gabriel n’acceptera que les quatre marques récoltées par ÉLISE, dans l’ordre des pièces. Consulte ton inventaire !',clueB:'LE DERNIER PACTE\n\nLe sceau d’Élise n’acceptera que les quatre marques récoltées par GABRIEL, dans l’ordre des pièces. Consulte ton inventaire !',story:'Vous n’êtes plus séparés que par une épaisse porte de pierre. Les symboles de vos découvertes se mettent à briller.',win:'La crypte tremble. Les dernières chaînes se brisent et la porte du jardin s’entrouvre.'}
];
let role=null,stage=0,elapsed=0,clock=null,notes=[],seen=new Set(),proofs=[],wrong=0,hints=0,solved=false,overlay='';const $=s=>document.querySelector(s);const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const fmt=()=>`${String(Math.floor(elapsed/60)).padStart(2,'0')}:${String(elapsed%60).padStart(2,'0')}`;
function start(r){role=r;stage=0;elapsed=0;notes=[];seen=new Set();proofs=[];wrong=0;hints=0;solved=false;clearInterval(clock);clock=setInterval(()=>{elapsed++;const el=$('#clock');if(el)el.textContent=fmt()},1000);render()}
function art(k){let col=['#574e48','#3d4950','#343f40','#4b3b38','#343b43'][k];let special='';if(k===0)special='<g fill="#302821" stroke="#ab9473" stroke-width="10"><rect x="130" y="120" width="175" height="245"/><rect x="670" y="120" width="175" height="245"/></g><ellipse cx="218" cy="225" rx="55" ry="87" fill="#765b4e"/><ellipse cx="758" cy="225" rx="55" ry="87" fill="#5c5552"/><path d="M438 470V178Q480 120 522 178V470" fill="#0b1213" stroke="#726c5b" stroke-width="15"/><path d="M458 185V470M502 185V470" stroke="#686759" stroke-width="8"/>';if(k===1)special='<rect x="95" y="135" width="280" height="270" fill="#4e4034" stroke="#8b7658" stroke-width="12"/><path d="M110 200h250M110 270h250M110 340h250" stroke="#342b29" stroke-width="20"/><g fill="#7f775e"><rect x="135" y="158" width="32" height="40"/><rect x="204" y="149" width="27" height="48"/><rect x="278" y="156" width="29" height="40"/></g><rect x="607" y="125" width="235" height="283" fill="#2b302f" stroke="#8e826c" stroke-width="12"/><circle cx="723" cy="252" r="82" fill="#424a48" stroke="#aa9977" stroke-width="12"/><path d="M723 250l-40-45m40 45 33-62" stroke="#ceb88b" stroke-width="7"/>';if(k===2)special='<path d="M130 465V130Q235 45 340 130V465" fill="#121f21" stroke="#756c5d" stroke-width="18"/><path d="M630 465V130Q735 45 840 130V465" fill="#121f21" stroke="#756c5d" stroke-width="18"/><g stroke="#7b7969" stroke-width="8"><path d="M150 205h170M650 205h170M150 305h170M650 305h170"/></g><path d="M480 465V185" stroke="#ac9673" stroke-width="10"/><circle cx="480" cy="172" r="40" fill="#776953"/>';if(k===3)special='<rect x="110" y="120" width="255" height="300" fill="#342c28" stroke="#8b715d" stroke-width="14"/><rect x="624" y="120" width="235" height="300" fill="#342c28" stroke="#8b715d" stroke-width="14"/><g fill="#5a4940"><circle cx="240" cy="205" r="60"/><rect x="200" y="265" width="80" height="92"/><circle cx="744" cy="205" r="60"/><rect x="704" y="265" width="80" height="92"/></g><ellipse cx="480" cy="410" rx="170" ry="55" fill="#655347" stroke="#a08b6d" stroke-width="10"/>';if(k===4)special='<path d="M285 465V160Q480-26 675 160V465" fill="#101718" stroke="#9a8468" stroke-width="22"/><path d="M320 450V200Q480 45 640 200V450" fill="#1c2323" stroke="#5c6259" stroke-width="8"/><circle cx="480" cy="260" r="125" fill="#343b3a" stroke="#b6a17c" stroke-width="13"/><circle cx="480" cy="260" r="79" fill="none" stroke="#c4ac7b" stroke-width="3" stroke-dasharray="9 16"/><path d="M480 180V340M400 260h160" stroke="#b6a17c" stroke-width="5"/>';return `<svg viewBox="0 0 960 550" preserveAspectRatio="xMidYMid slice" role="img" aria-label="Décor illustré du manoir"><defs><radialGradient id="light"><stop stop-color="${col}"/><stop offset="1" stop-color="#0a1112"/></radialGradient><linearGradient id="floor" x2="0" y2="1"><stop stop-color="#4a4037"/><stop offset="1" stop-color="#161c1b"/></linearGradient></defs><rect width="960" height="550" fill="url(#light)"/><path d="M0 0 95 390 865 390 960 0" fill="#1a2424" opacity=".56"/><path d="M95 390H865L960 550H0Z" fill="url(#floor)"/><path d="M95 390 0 550M865 390 960 550M220 390l-75 160M740 390l75 160M0 478h960" fill="none" stroke="#9b886c" stroke-width="4" opacity=".22"/><path d="M0 0 95 390M960 0 865 390" stroke="#888073" stroke-width="18" opacity=".45"/><g fill="#c6a86a" opacity=".62"><path d="M400 0h8v100h-8zM552 0h8v100h-8z"/><circle cx="404" cy="116" r="26"/><circle cx="556" cy="116" r="26"/></g>${special}<rect width="960" height="550" fill="#000" opacity=".15"/></svg>`}
function landing(){return `<section class="hero"><div class="hero-inner"><div class="overline">Une aventure coopérative à deux ordinateurs</div><h1>LE MANOIR<br>DES DEUX OMBRES</h1><p class="intro">La porte se referme. Deux ailes. Deux prisonniers. Dans chaque salle, un personnage découvre ce que l’autre ne peut pas voir. Fouillez le manoir, décryptez les mécanismes et réunissez vos preuves pour vous échapper.</p><div class="choice"><button class="role" onclick="start('A')"><span class="mono">PERSONNAGE 01 · AILE OUEST</span><h2>Élise Varenne</h2><p>L’exploratrice. Les portraits, les registres et les notes abandonnées sont ses seuls alliés.<br><br>Incarner Élise ↗</p></button><button class="role" onclick="start('B')"><span class="mono">PERSONNAGE 02 · AILE EST</span><h2>Gabriel Morel</h2><p>L’enquêteur. Les machines, les archives et les serrures anciennes n’ont aucun secret pour lui.<br><br>Incarner Gabriel ↗</p></button></div><div class="instruction"><strong>COMMENT JOUER :</strong> ouvrez tous les deux le même lien sur vos Mac, choisissez chacun un personnage différent et parlez-vous sans regarder l’écran de l’autre. Cliquez sur les objets du décor pour trouver des informations et débloquer les portes. <strong>Vos écrans ne se synchronisent pas automatiquement :</strong> chacun valide sa serrure, puis vous passez ensemble à la salle suivante. 5 salles · 10 serrures · 35 à 50 minutes selon votre expérience.</div></div></section>`}
function game(){const x=scenes[stage],mine=x[role],id=role==='A'?'ÉLISE · AILE OUEST':'GABRIEL · AILE EST';return `<header class="toolbar"><div class="brand">LE MANOIR <span>/</span> DEUX OMBRES</div><div class="tabs"><span class="role-id">${id}</span><span class="timeline" id="clock">${fmt()}</span><button class="tab" onclick="showInventory()">▣ Inventaire (${proofs.length})</button><button class="tab" onclick="showJournal()">☷ Journal</button><button class="tab" onclick="showRules()">? Aide</button></div></header><main class="layout"><section><div class="topline"><div><small>CHAPITRE ${String(stage+1).padStart(2,'0')} / 05 · ${x.short}</small><h2>${x.title}</h2></div><span class="role-id">${role==='A'?'OUEST':'EST'}</span></div><div class="room">${art(stage)}<div class="room-title">${esc(x.sub)}</div><button class="hot ${seen.has('self')?'seen':''}" style="top:39%;left:24%" onclick="inspect('self')">◈ Examiner</button><button class="hot ${seen.has('partner')?'seen':''}" style="top:38%;left:76%" onclick="inspect('partner')">▤ Document</button><button class="hot lock" style="top:72%;left:50%" onclick="inspect('lock')">♢ ${solved?'Ouvert':'Serrure'}</button><div class="bottom-prompt">${solved?'Serrure ouverte. Préviens ton partenaire, puis passe à la suite.':'Fouille le décor. Tu ne peux pas résoudre ton cadenas sans une information de ton partenaire.'}</div></div><div class="track">${scenes.map((_,i)=>`<div class="${i<stage?'past':i===stage?'current':''}"></div>`).join('')}</div><div class="inline-controls"><button class="ghost" onclick="showHint()">✧ Demander un indice</button><button class="primary" ${solved?'':'disabled'} onclick="next()">${stage===4?'Quitter le manoir':'Accéder au chapitre suivant'} →</button></div></section><aside class="aside"><section class="panel"><span class="label">Histoire</span><h3>${x.title}</h3><p>${x.story}</p><p>${x.sub}</p></section><section class="panel"><span class="label">Objectif actuel</span><h3>${esc(mine.door)}</h3><p>Les autres salles renferment les informations nécessaires. Partagez ce que vous découvrez et gardez vos preuves.</p><span class="badge">${solved?'✓ SERRURE OUVERTE':'● VERROUILLÉ'}</span></section><section class="panel"><span class="label">Vos découvertes</span><h3>Carnet d’enquête</h3><ul class="notelist">${notes.slice(-4).reverse().map(n=>`<li>${esc(n)}</li>`).join('')||'<li>Rien pour le moment. Fouille la salle.</li>'}</ul></section></aside></main><div id="overlay"></div>`}
function render(){if(!role){$('#app').innerHTML=landing();return}if(stage>=scenes.length){clearInterval(clock);$('#app').innerHTML=`<section class="hero"><div class="hero-inner end"><div class="overline">Le pacte est rompu</div><h1>VOUS ÊTES<br>LIBRES</h1><p class="intro">La dernière porte s’ouvre. Élise et Gabriel se retrouvent sous le ciel gris de l’aube. Derrière eux, les fenêtres du manoir s’éteignent une à une. Vous avez réussi parce que vous avez partagé vos indices.</p><p class="endstats">Ton temps : ${fmt()} · Indices consultés : ${hints} · Essais incorrects : ${wrong}</p><button class="primary" onclick="window.location.reload()">Recommencer l’aventure</button></div></section>`;return}$('#app').innerHTML=game()}
function openModal(title,body){$('#overlay').innerHTML=`<div class="modal-overlay" onclick="if(event.target===this)closeModal()"><section class="modal" role="dialog" aria-modal="true" aria-label="${esc(title)}"><button class="close" aria-label="Fermer" onclick="closeModal()">×</button><div class="overline">LE MANOIR · CHAPITRE ${stage+1}</div><h2>${esc(title)}</h2>${body}</section></div>`;setTimeout(()=>{const f=$('#code');if(f)f.focus()},0)}function closeModal(){const o=$('#overlay');if(o)o.innerHTML=''}function record(s){if(!notes.includes(s))notes.push(s)}
function inspect(what){const x=scenes[stage],mine=x[role];if(what==='self'){seen.add('self');record('Mécanisme inspecté : '+mine.door);openModal('Le mécanisme',`<p>Une feuille épinglée à côté du mécanisme décrit son fonctionnement :</p><div class="paper">${esc(mine.lock)}</div><p>${esc(mine.aid)}</p>`)}if(what==='partner'){seen.add('partner');const clue=role==='A'?x.clueA:x.clueB;record('Document pour mon partenaire retrouvé.');openModal('Document à transmettre',`<p>Ce document ne résout pas ta serrure : <strong>lis-le à ton partenaire</strong> pour l’aider.</p><div class="paper">${esc(clue)}</div><p class="timeline">Dicte cette information à ton partenaire ou note-la sur papier.</p>`)}if(what==='lock'){if(solved){openModal('Porte déverrouillée',`<p>Ta serrure est déjà ouverte. Communique-le à ton partenaire.</p><button class="primary" onclick="closeModal();next()">${stage===4?'Quitter le manoir':'Salle suivante'} →</button>`)}else openModal(mine.door,`<p>Observe le mécanisme et interroge ton partenaire pour déterminer le code.</p><div class="paper dark">${esc(mine.lock)}</div><form onsubmit="submitCode(event)"><div class="inline-controls"><input id="code" class="input" name="code" autocomplete="off" aria-label="Code secret" placeholder="CODE" maxlength="12" required><button class="primary" type="submit">Déverrouiller</button></div><div class="feedback" id="fb"></div></form><p class="timeline">Pas de pénalité de temps : la difficulté vient de la déduction.</p>`) }renderMarks()}
function renderMarks(){document.querySelectorAll('.hot').forEach(b=>{if(b.textContent.includes('Examiner'))b.classList.toggle('seen',seen.has('self'));if(b.textContent.includes('Document'))b.classList.toggle('seen',seen.has('partner'))})}
function submitCode(ev){ev.preventDefault();const mine=scenes[stage][role],v=$('#code').value.trim().toUpperCase().replace(/\s/g,'').normalize('NFD').replace(/[\u0300-\u036f]/g,'');if(v!==mine.answer){wrong++;$('#fb').textContent='Ce code ne correspond pas au mécanisme. Compare tes informations avec celles de ton partenaire.';return}solved=true;proofs.push({place:scenes[stage].title,mark:mine.artifact});record(`Preuve récupérée : ${mine.artifact}`);openModal('La serrure cède',`<p>${scenes[stage].win}</p><div class="paper dark">NOUVELLE PREUVE : <strong style="font-size:30px;color:#e3c790">${esc(mine.artifact)}</strong><br><small>Conserve cette marque : tu en auras besoin pour le dernier chapitre.</small></div><p><strong>Préviens ton partenaire.</strong> Ne passez à la suite que lorsque chacun a ouvert sa propre serrure.</p><button class="primary" onclick="closeModal();next()">${stage===4?'Sortir du manoir':'Explorer la salle suivante'} →</button>`);}
function next(){if(!solved)return;stage++;seen=new Set();solved=false;notes=[];render()}
function showInventory(){openModal('Inventaire des preuves',`<p>Tu conserves les marques récupérées dans chaque salle. <strong>Ne les partage pas avant d’en avoir besoin.</strong></p>${proofs.length?proofs.map((o,i)=>`<div class="paper dark">${i+1}. ${esc(o.place)} <strong style="float:right;font-size:25px">${esc(o.mark)}</strong></div>`).join(''):'<p>Aucune preuve récoltée.</p>'}`)}function showJournal(){openModal('Journal personnel',`<p>Les notes concernent uniquement cette salle.</p>${notes.length?'<ul class="notelist">'+notes.map(n=>'<li>'+esc(n)+'</li>').join('')+'</ul>':'<p>Tu n’as encore rien inspecté.</p>'}`)}function showHint(){hints++;const mine=scenes[stage][role];openModal('Indice du gardien',`<p><strong>Premier conseil :</strong> ${esc(mine.aid)}</p><details><summary style="cursor:pointer;color:#ddc38e;padding:12px 0">Afficher un indice plus précis (spoiler)</summary><p>${esc(mine.help)}</p></details>`)}function showRules(){openModal('Règles de la coopération',`<p><strong>1.</strong> Deux Mac, un même site, deux rôles différents. Communiquez à voix haute sans regarder l’autre écran.</p><p><strong>2.</strong> Dans chaque pièce, fouille les points interactifs : le mécanisme, le document et la serrure.</p><p><strong>3.</strong> Le document aide ton partenaire ; de ton côté tu as besoin du sien pour ouvrir ton propre verrou.</p><p><strong>4.</strong> Après ouverture, une preuve rejoint ton inventaire. Elle sera utile à la fin.</p><p><strong>5.</strong> Attendez que vos deux serrures soient ouvertes avant de changer de pièce. <strong>Le site ne synchronise pas vos actions automatiquement.</strong></p>`)}render();
</script></body></html>
