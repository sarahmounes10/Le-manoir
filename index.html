<head>

<style>
@import url('https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Playfair+Display:wght@600;700&display=swap');
:root{color-scheme:dark;--bg:#101018;--surface:#1d1e2b;--raised:#292b3b;--edge:#414354;--text:#f5f1e9;--muted:#bcb9c8;--accent:#e8bd78;--good:#8cdeb9;--danger:#ff9d9d}
*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 13% -10%,#393040 0,transparent 42%),radial-gradient(circle at 100% 20%,#192840 0,transparent 36%),var(--bg);color:var(--text);font-family:'DM Sans',system-ui,sans-serif;min-height:100vh}button,input{font:inherit}button{cursor:pointer}button:focus-visible,input:focus-visible{outline:3px solid var(--accent);outline-offset:3px}.wrap{max-width:1060px;margin:auto;padding:28px 20px 55px}.top{display:flex;align-items:center;justify-content:space-between;gap:16px;margin-bottom:35px;flex-wrap:wrap}.logo{font-weight:700;letter-spacing:.16em;color:var(--accent);font-size:.9rem}.small{color:var(--muted);font-size:.88rem}.tag{display:inline-flex;border:1px solid var(--edge);padding:6px 11px;border-radius:99px;color:var(--muted);font-size:.78rem}.hero{padding:24px 0 32px}.eyebrow{font-size:.76rem;letter-spacing:.22em;text-transform:uppercase;color:var(--accent);font-weight:700}h1,h2,h3{font-family:'Playfair Display',Georgia,serif}h1{font-size:clamp(2.65rem,8vw,5.1rem);line-height:1.03;letter-spacing:-.04em;margin:12px 0 20px}h2{font-size:clamp(1.8rem,5vw,2.8rem);margin:8px 0 13px}h3{font-size:1.45rem;margin:0 0 12px}p{line-height:1.67;color:#d5d0db}.hero p{max-width:680px;font-size:1.05rem}.cards{display:grid;grid-template-columns:repeat(3,1fr);gap:18px}.game-card{border:1px solid var(--edge);border-radius:22px;overflow:hidden;background:var(--surface);display:flex;flex-direction:column}.art{height:160px;display:flex;align-items:center;justify-content:center;position:relative;overflow:hidden;font-size:5.4rem;text-shadow:0 6px 26px #0008}.art:after{content:"";position:absolute;inset:0;background:linear-gradient(transparent,#15121a70)}.art.manor{background:radial-gradient(circle at 50% 12%,#7d5a70,#33233a 65%,#17131e)}.art.crime{background:radial-gradient(circle at 50% 10%,#647d84,#20333c 63%,#121c24)}.art.space{background:radial-gradient(circle at 65% 30%,#4d638b,#152442 60%,#0c1225)}.game-body{padding:19px;display:flex;flex-direction:column;flex:1}.game-body p{font-size:.92rem;flex:1;margin:7px 0 18px}.stats{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:18px}.btn{border:0;border-radius:12px;padding:13px 19px;font-weight:700;background:var(--accent);color:#20191b;transition:filter .15s,transform .15s}.btn:hover{filter:brightness(1.1);transform:translateY(-1px)}.btn.secondary{background:var(--raised);border:1px solid var(--edge);color:var(--text)}.btn.ghost{background:transparent;border:1px solid var(--edge);color:var(--text)}.btn:disabled{opacity:.5;cursor:not-allowed}.btn.wide{width:100%}.back{background:none;border:0;color:var(--muted);padding:8px 0;margin-bottom:14px}.panel{background:#1a1b29e8;border:1px solid var(--edge);border-radius:22px;padding:25px}.intro{max-width:720px;margin:10px auto}.intro .banner{padding:24px;border-radius:18px;margin-bottom:24px;display:flex;align-items:center;gap:20px}.banner .symbol{font-size:3.3rem}.role-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin:23px 0}.role{background:#252637;border:2px solid #414355;border-radius:16px;padding:18px;text-align:left;cursor:pointer;color:var(--text);min-height:140px}.role strong{display:block;font-size:1.2rem;margin-bottom:8px}.role span{display:block;line-height:1.5;color:var(--muted);font-size:.9rem}.role.selected{border-color:var(--accent);background:#393140}.role .check{font-size:1.5rem;display:block;margin-bottom:12px}.instructions{background:#272838;padding:14px 16px;border-left:3px solid var(--accent);border-radius:8px;font-size:.9rem;line-height:1.65;color:#e5e0e4;margin-bottom:24px}.play-header{display:flex;align-items:center;justify-content:space-between;gap:18px;flex-wrap:wrap;margin-bottom:19px}.play-header .mini-title{font-family:Georgia,serif;font-size:1.4rem}.time{font-variant-numeric:tabular-nums;background:#242737;border:1px solid var(--edge);padding:9px 13px;border-radius:11px}.time.urgent{color:var(--danger)}.progress{height:8px;background:#343443;border-radius:99px;overflow:hidden;margin:10px 0 24px}.progress div{height:100%;background:linear-gradient(90deg,#d99e67,#f7d895);transition:width .3s}.play-layout{display:grid;grid-template-columns:minmax(0,1.35fr) minmax(270px,.85fr);gap:18px}.story{padding:24px;min-height:380px}.step-count{color:var(--accent);font-size:.78rem;font-weight:700;letter-spacing:.16em;text-transform:uppercase}.prompt{font-size:1.1rem;font-weight:600;color:#fff;line-height:1.6;margin:17px 0 20px}.note{border:1px dashed #69657a;border-radius:14px;background:#292938;padding:18px;margin:15px 0}.note .note-title{font-size:.78rem;text-transform:uppercase;color:var(--accent);font-weight:700;letter-spacing:.1em;margin-bottom:10px}.note p{margin:0;white-space:pre-line;font-size:1.04rem;line-height:1.8;color:#f4e9dc}.answer{display:flex;gap:10px;margin-top:20px}.answer input{width:100%;min-width:0;border:1px solid #757186;background:#11131f;color:var(--text);padding:12px 14px;border-radius:11px;text-transform:uppercase;letter-spacing:.08em}.answer .btn{white-space:nowrap}.feedback{font-size:.93rem;min-height:25px;margin-top:10px}.feedback.bad{color:var(--danger)}.feedback.good{color:var(--good)}.aside{display:flex;flex-direction:column;gap:16px}.hint-box{padding:22px}.hint-box p{font-size:.91rem}.hints{border-top:1px solid var(--edge);padding-top:14px;margin-top:15px}.hints button{font-size:.83rem;margin:5px 5px 7px 0}.hint-text{font-size:.88rem;color:#e9d7b9;background:#37313a;padding:11px;border-radius:10px;margin-bottom:9px;line-height:1.65}.tools{display:flex;gap:8px;flex-wrap:wrap;margin-top:15px}.win{text-align:center;max-width:720px;margin:30px auto}.win .trophy{font-size:5rem}.win .panel{padding:42px 28px}.result{font-size:1.4rem;color:var(--accent);font-weight:700}.footer{color:#a7a2b4;margin-top:45px;font-size:.82rem;border-top:1px solid #383544;padding-top:20px;line-height:1.7}.warn{color:#f3d29b}a{color:#f0c987}.sr{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);border:0}@media(max-width:770px){.cards{grid-template-columns:1fr}.art{height:125px}.play-layout{grid-template-columns:1fr}.role-grid{grid-template-columns:1fr}.wrap{padding:18px 14px 40px}.panel{padding:19px}.answer{flex-wrap:wrap}.answer .btn{width:100%}.top{margin-bottom:12px}}
</style>
</head>
<body><main class="wrap" id="app"></main>
<script>
'use strict';
const games=[
{id:'manoir',title:'Le Manoir des Deux Ombres',subtitle:'L’héritage maudit',emoji:'🏚️',theme:'manor',duration:30,roles:[{name:'L’Exploratrice',detail:'Tu explores les pièces, lis les inscriptions et observes les objets.'},{name:'L’Archiviste',detail:'Tu possèdes des documents anciens qui expliquent ce que ta partenaire voit.'}],intro:'À minuit, les portes du manoir des Valombre se referment derrière vous. La dernière propriétaire a laissé sept serrures, sept secrets et un avertissement : « Aucun esprit ne peut sortir seul. » Trouvez comment ouvrir la porte avant que les cloches ne sonnent.',steps:[
{title:'Le cadran aux quatre symboles',scene:'Dans le vestibule, une horloge sans aiguilles possède quatre emplacements. Une corneille sculptée regarde une lune d’argent. Le verrou attend quatre chiffres.',question:'Quel est le code à quatre chiffres de l’horloge ?',clues:['Dans la marge du cadran : « Une LUNE vaut 1. Une CORNEILLE vaut 4. »','Dans le journal du majordome : « Le cadran chante : LUNE, CORNEILLE, CORNEILLE, LUNE. »'],answer:'1441',hint:['Associez une valeur à chaque symbole.','Suivez l’ordre indiqué dans le journal : lune, corneille, corneille, lune.'],reveal:'Le mécanisme cède. Derrière l’horloge, un escalier mène à la galerie des portraits.'},
{title:'Les héritiers effacés',scene:'Trois portraits portent un nom, mais leurs plaques chiffrées ont disparu. Une boîte en cuivre attend les trois chiffres correspondant à l’ordre des héritiers.',question:'Dans quel ordre faut-il entrer les chiffres des trois portraits ?',clues:['Le testament précise : « Élise fut nommée avant Victor. Victor fut nommé avant Nora. »','Une fiche d’inventaire associe : Élise = 6 ; Victor = 2 ; Nora = 9.'],answer:'629',hint:['Reconstituez d’abord l’ordre des personnes.','Élise, puis Victor, puis Nora : remplacez les noms par leurs chiffres.'],reveal:'La boîte révèle une lettre codée, signée de la main de la propriétaire.'},
{title:'La lettre décalée',scene:'Une lettre enroulée porte quatre grandes lettres à l’encre violette. La serrure de la bibliothèque ne comporte que des lettres.',question:'Quel mot de quatre lettres ouvre la bibliothèque ?',clues:['Sur un ancien décodeur : « Pour lire ma vérité, recule chaque lettre de deux places dans l’alphabet. » Exemple : C devient A.','Sur la lettre, le seul mot écrit en capitales est : NWPG.'],answer:'LUNE',hint:['Décalez chaque lettre du mot crypté de deux rangs vers le début de l’alphabet.','N→L, W→U, P→N, G→E.'],reveal:'La bibliothèque s’ouvre. L’air sent la terre humide et les roses séchées.'},
{title:'Le jardin sous verre',scene:'Au milieu d’une serre abandonnée, un coffret montre quatre fenêtres. Dans chaque fenêtre, il faut entrer le chiffre d’une fleur.',question:'Quel code donne la combinaison de fleurs ?',clues:['L’herbier indique : ROSE = 5 ; LYS = 2. Les autres fleurs sont rayées.','Sur le coffret, quatre fleurs sont dessinées de gauche à droite : ROSE — LYS — ROSE — LYS.'],answer:'5252',hint:['Seules deux espèces comptent ici.','Lisez les fleurs dans l’ordre et remplacez chaque nom par sa valeur.'],reveal:'Une petite clé de piano tombe du coffret. Une mélodie semble monter de la salle de musique.'},
{title:'Le piano silencieux',scene:'Un piano mécanique a perdu ses touches. À sa place, quatre emplacements portent des chiffres à saisir.',question:'Quels quatre chiffres correspondent à la mélodie ?',clues:['Sur le piano : DO = 1 ; RÉ = 2 ; MI = 3 ; FA = 4 ; SOL = 5.','Une partition indique quatre notes dans cet ordre : SOL — MI — DO — RÉ.'],answer:'5312',hint:['Le code suit les notes de la partition.','SOL vaut 5 ; MI vaut 3 ; DO vaut 1 ; RÉ vaut 2.'],reveal:'Un passage secret s’ouvre derrière l’instrument, vers les fondations du manoir.'},
{title:'La carte des souterrains',scene:'Dans les souterrains, trois leviers sont marqués « cave », « tour » et « hall ». Leur ordre déclenche une dernière serrure.',question:'Quel code à trois chiffres actionne les leviers ?',clues:['Une vieille carte mentionne : TOUR = 8 ; CAVE = 3 ; HALL = 6.','Une consigne gravée dit : « D’abord là où l’on garde le vin, ensuite là où l’on voit loin, enfin là où l’on accueille les invités. »'],answer:'386',hint:['La phrase décrit trois lieux du manoir.','Cave, puis tour, puis hall : remplacez chaque lieu par son chiffre.'],reveal:'Un souffle glacé traverse le couloir. Vous voici devant la porte de sortie.'},
{title:'La date oubliée',scene:'La porte d’entrée porte une date : « Année du dernier bal ». Mais la date du bal a été effacée, remplacée par une énigme.',question:'Quelle année faut-il saisir pour quitter le manoir ?',clues:['Le carnet des festivités porte cette mention : « Le manoir a fermé ses portes en 1894. »','Au dos d’une invitation : « Le dernier bal a eu lieu dix-sept ans avant la fermeture. »'],answer:'1877',hint:['Il faut retrouver une année antérieure.','1894 − 17 = ?'],reveal:'La porte s’ouvre sur l’aube. Un murmure vous remercie. Le manoir a livré son secret.'}
]},
{id:'enquete',title:'Le Dernier Train de Minuit',subtitle:'Enquête criminelle',emoji:'🕵️',theme:'crime',duration:30,roles:[{name:'La Détective',detail:'Tu interroges les témoins et observes la scène du crime.'},{name:'L’Analyste',detail:'Tu as accès aux fichiers, aux relevés et aux pièces à conviction.'}],intro:'À 23 h 59, le célèbre collectionneur Adrien Morel a disparu dans une gare condamnée. La police ne croit pas à un enlèvement, mais une valise ensanglantée et un billet sans destination sèment le doute. Vous avez sept pistes pour retrouver le témoin-clé avant son départ.',steps:[
{title:'L’horloge trompeuse',scene:'Un billet d’arrivée se trouve sous la banquette du quai 4. Une caméra est restée bloquée sur l’heure exacte où le train s’est arrêté.',question:'À quelle heure réelle est arrivé le train ? Répondez en quatre chiffres (HHMM).',clues:['Un billet indique l’arrivée affichée sur l’horloge du quai : 21 h 14.','Le technicien note : « L’horloge du quai avance de huit minutes sur l’heure réelle. »'],answer:'2106',hint:['Une horloge en avance affiche une heure plus tardive que la réalité.','21 h 14 moins 8 minutes.'],reveal:'À 21 h 06, une silhouette est descendue du train avec une enveloppe rouge.'},
{title:'La valise des preuves',scene:'Une valise verrouillée contient les enregistrements de la soirée. Trois symboles représentent les preuves récupérées.',question:'Quel code à trois chiffres ouvre la valise ?',clues:['Le registre de police attribue : BAGUE = 7 ; ENVELOPPE = 4 ; BILLET = 9.','La consigne du procureur : « Rangez les preuves par ordre alphabétique de leur nom : billet, enveloppe et bague ne sont pas déjà dans le bon ordre. »'],answer:'794',hint:['L’ordre alphabétique porte sur les noms des objets.','Bague, billet, enveloppe → 7, 9, 4.'],reveal:'Dans la valise, vous découvrez un télégramme chiffré.'},
{title:'Le télégramme à numéros',scene:'Le télégramme contient cinq nombres. Le destinataire s’est servi d’une substitution classique pour cacher un mot de passe.',question:'Quel mot de cinq lettres apparaît ?',clues:['Une note explique le code : A = 1, B = 2, C = 3, …, Z = 26.','La ligne du télégramme : 13 - 15 - 18 - 19 - 5.'],answer:'MORSE',hint:['Chaque nombre représente le rang d’une lettre.','13=M, 15=O, 18=R, 19=S, 5=E.'],reveal:'Le mot de passe donne accès à un récepteur radio oublié sous le quai.'},
{title:'Le message sur les ondes',scene:'Le récepteur émet une série de sons longs et courts. La séquence doit être traduite en un mot.',question:'Quel mot de quatre lettres est transmis ?',clues:['Un aide-mémoire donne : A = .- ; C = -.-. ; E = . ; S = ... ; K = -.- ; R = .-.','La bande de réception contient : -.-.  .-  ...  .  (les espaces séparent les lettres).'],answer:'CASE',hint:['Interprétez chaque groupe de points et traits comme une lettre.','-.-. = C ; .- = A ; ... = S ; . = E.'],reveal:'La radio vous dirige vers une consigne à bagages portant le mot « CASE ».'},
{title:'La personne au manteau',scene:'Un gardien a croisé trois personnes avant la disparition. Une seule portait le vêtement décrit dans son rapport.',question:'Quel prénom faut-il inscrire sur le dossier ?',clues:['Le dossier des voyageurs précise : Clara portait du rouge, Jules du bleu et Mina du vert.','Le gardien a déclaré : « La personne que j’ai vue sortir de la consigne portait un manteau VERT. »'],answer:'MINA',hint:['Comparez la couleur du témoignage avec les trois fiches.','Le manteau vert est celui de Mina.'],reveal:'Mina n’est pas la coupable : elle explique avoir suivi le véritable ravisseur sur les caméras.'},
{title:'L’image manquante',scene:'Une caméra a enregistré l’entrée du suspect dans le tunnel. Sa sortie n’apparaît que sur une deuxième caméra, dont l’heure doit être reconstituée.',question:'À quelle heure le suspect est-il sorti du tunnel ? Quatre chiffres (HHMM).',clues:['L’enregistrement d’entrée porte l’heure exacte : 22 h 18.','Le rapport de surveillance donne un délai de 36 minutes entre l’entrée et la sortie.'],answer:'2254',hint:['Additionnez les minutes au relevé d’entrée.','22 h 18 + 36 minutes = 22 h 54.'],reveal:'La deuxième caméra montre le suspect déposer un message à proximité du panneau des départs.'},
{title:'Le lieu du rendez-vous',scene:'Sur une feuille déchirée, le ravisseur a dessiné trois lieux et indiqué un rendez-vous final.',question:'Quel code composé d’une lettre et d’un chiffre désigne le lieu du rendez-vous ?',clues:['La carte des lieux donne : ENTREPÔT = Q7 ; BERGE = R2 ; GARE = T9.','Le message du témoin : « Je t’attends sous la grande horloge des départs, à la gare. »'],answer:'T9',hint:['Repérez le lieu décrit dans le message.','La gare correspond au code T9.'],reveal:'Vous retrouvez Morel vivant sous l’horloge. Il s’était caché après avoir découvert un trafic de tableaux. Dossier résolu !'}
]},
{id:'orbite',title:'Station ORION : Alerte Rouge',subtitle:'Mission de survie spatiale',emoji:'🚀',theme:'space',duration:30,roles:[{name:'La Commandante',detail:'Tu surveilles les systèmes du vaisseau, les écrans et les commandes.'},{name:'L’Ingénieure',detail:'Tu as les plans techniques et les procédures de réparation.'}],intro:'Année 2186. Une pluie de météorites a endommagé la station ORION. L’oxygène chute, le pilote automatique a disparu et les communications sont coupées. Vous êtes les deux dernières personnes à bord. Sept systèmes doivent être réparés pour lancer une capsule de sauvetage.',steps:[
{title:'La réserve d’oxygène',scene:'La console de survie refuse de s’activer tant que la quantité exacte d’oxygène restant n’est pas saisie.',question:'Combien d’unités d’oxygène reste-t-il ?',clues:['Il y a 4 modules d’oxygène initialement pleins, contenant chacun 12 unités.','Le rapport de fuite estime une perte totale de 9 unités depuis l’impact.'],answer:'39',hint:['Calculez d’abord le stock initial.','4 × 12 − 9 = ?'],reveal:'Les sas de sécurité s’ouvrent. Vous pouvez atteindre la salle de contrôle.'},
{title:'Le tableau de pression',scene:'Quatre cadrans affichent des valeurs. Le tableau de pression attend une séquence de quatre chiffres.',question:'Dans quel ordre entrer les quatre chiffres ?',clues:['Les quatre relevés affichent : A = 7 ; B = 3 ; C = 9 ; D = 2.','La procédure d’urgence indique : « Du relevé le PLUS ÉLEVÉ au PLUS FAIBLE, saisissez les chiffres observés. »'],answer:'9732',hint:['Il faut trier les valeurs, pas les lettres des cadrans.','Par ordre décroissant : 9, 7, 3, 2.'],reveal:'La coque retrouve une pression stable. Un plan holographique se matérialise.'},
{title:'Les coordonnées du robot',scene:'Le robot de maintenance est bloqué. Il attend deux coordonnées, X et Y, pour rejoindre la zone à réparer.',question:'Entrez les coordonnées sous la forme X-Y (exemple : 5-8).',clues:['Le panneau de navigation indique : X = 8 + 5.','Le manuel technique indique : Y = 6 × 3.'],answer:'13-18',hint:['Calculez séparément X et Y.','X = 13, Y = 18.'],reveal:'Le robot atteint la section endommagée et remet l’antenne sous tension.'},
{title:'Le miroir des étoiles',scene:'Un message d’origine inconnue s’affiche sur l’écran noir du poste radio. Sa clé est inscrite dans une ancienne documentation.',question:'Quel mot de cinq lettres est caché ?',clues:['Le chiffrement inverse l’alphabet : A ↔ Z, B ↔ Y, C ↔ X, etc.','Le message intercepté est : LIRLM.'],answer:'ORION',hint:['La première lettre, L, devient O dans l’alphabet inversé.','L→O, I→R, R→I, L→O, M→N.'],reveal:'Le mot ORION désactive le verrouillage de la navigation.'},
{title:'La remise en énergie',scene:'Trois sources d’énergie doivent être activées dans le bon ordre. Une erreur couperait l’alimentation des moteurs.',question:'Quel code de trois chiffres active les sources dans le bon ordre ?',clues:['Le tableau donne : SOLAIRE = 6 ; BATTERIE = 4 ; RÉACTEUR = 9.','Le protocole dit : « D’abord le réacteur, puis le solaire, enfin la batterie. »'],answer:'964',hint:['Suivez l’ordre du protocole, pas celui du tableau.','Réacteur = 9 ; solaire = 6 ; batterie = 4.'],reveal:'Les moteurs s’allument dans un grondement sourd. Il reste à calculer la trajectoire.'},
{title:'Le cap de fuite',scene:'Un nuage de débris traverse la route de votre capsule. Il faut corriger le cap initial pour éviter une collision.',question:'Quel cap en degrés devez-vous programmer ? (Un nombre entier.)',clues:['La passerelle affiche un cap initial de 120 degrés.','Le calculateur demande une correction de 35 degrés vers la gauche : il faut SOUSTRAIRE 35 au cap initial.'],answer:'85',hint:['Une correction vers la gauche fait diminuer le cap.','120 − 35 = ?'],reveal:'Le radar confirme une trajectoire sûre. Le sas de la capsule est à portée.'},
{title:'Le code d’évacuation',scene:'La capsule de secours exige un dernier code à quatre chiffres. Deux valeurs doivent être saisies l’une après l’autre sur deux positions chacune.',question:'Quel code à quatre chiffres lance la capsule ?',clues:['La commandante lit : « Nombre de ponts encore habités : 4. » Le nombre doit être écrit sur DEUX chiffres.','L’ingénieure lit : « Nombre de capsules de secours recensées : 12. » Le code se construit avec les ponts puis les capsules.'],answer:'0412',hint:['La première donnée doit occuper exactement deux chiffres.','4 devient 04, puis ajoutez 12.'],reveal:'La capsule quitte ORION quelques secondes avant l’explosion du réservoir. Mission réussie : vous êtes sauvées !'}
]}];
const app=document.getElementById('app');let state={page:'home',game:null,role:null,step:0,seconds:0,hints:0,feedback:'',answer:'',stopped:false};let ticker=null;
function clean(v){return String(v||'').normalize('NFD').replace(/[\u0300-\u036f]/g,'').toUpperCase().replace(/[^A-Z0-9]/g,'')}
function esc(v){return String(v).replace(/[&<>"']/g,ch=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[ch]))}
function fmt(t){return String(Math.floor(t/60)).padStart(2,'0')+':'+String(t%60).padStart(2,'0')}
function safeSave(){try{sessionStorage.setItem('les-trois-portes',JSON.stringify({game:state.game?.id,role:state.role,step:state.step,seconds:state.seconds,page:state.page}))}catch(e){}}
function startClock(){clearInterval(ticker);ticker=setInterval(()=>{if(state.page!=='play'||state.stopped)return;state.seconds++;safeSave();const el=document.querySelector('#clock');if(el){el.textContent=fmt(state.seconds);el.classList.toggle('urgent',state.seconds>1800)}},1000)}
function home(){clearInterval(ticker);state.page='home';state.game=null;safeSave();app.innerHTML=`<header class="top"><div class="logo">✦ LES TROIS PORTES</div><div class="tag">3 aventures · 2 ordinateurs · 0 €</div></header><section class="hero"><div class="eyebrow">Trois mondes. Deux esprits. Une seule issue.</div><h1>Votre soirée<br>d'évasion commence ici.</h1><p>Trois escape games coopératifs créés pour jouer à deux, chacun sur son ordinateur. Choisissez un univers, prenez des rôles complémentaires et résolvez les mystères en vous parlant. Aucun compte, aucune installation.</p></section><section class="cards">${games.map(g=>`<article class="game-card"><div class="art ${g.theme}" aria-hidden="true">${g.emoji}</div><div class="game-body"><div class="eyebrow">${esc(g.subtitle)}</div><h3>${esc(g.title)}</h3><p>${esc(g.intro)}</p><div class="stats"><span class="tag">⏱ ~30 min</span><span class="tag">🔐 7 énigmes</span><span class="tag">👥 2 rôles</span></div><button class="btn wide" data-game="${g.id}">Entrer dans l'aventure →</button></div></article>`).join('')}</section><div class="footer">🕯️ Conseils : jouez en appel vocal, ne regardez pas l’écran de l’autre et choisissez chacun un rôle différent. Les réponses sont validées sur chaque ordinateur indépendamment. Le chronomètre est indicatif : aucun échec automatique après 30 minutes.</div>`;document.querySelectorAll('[data-game]').forEach(b=>b.onclick=()=>intro(games.find(g=>g.id===b.dataset.game)))}
function intro(g){clearInterval(ticker);state={page:'intro',game:g,role:null,step:0,seconds:0,hints:0,feedback:'',answer:'',stopped:false};safeSave();renderIntro()}
function renderIntro(){let g=state.game;app.innerHTML=`<header class="top"><div class="logo">✦ LES TROIS PORTES</div><span class="tag">${esc(g.subtitle)}</span></header><button class="back" id="back">← Choisir un autre jeu</button><section class="intro"><div class="banner art ${g.theme}" style="height:125px"><div class="symbol">${g.emoji}</div></div><div class="eyebrow">Prologue · Environ 30 minutes</div><h2>${esc(g.title)}</h2><p>${esc(g.intro)}</p><h3>Choisissez votre rôle</h3><p>Chaque joueur doit sélectionner <strong>un rôle différent</strong> sur son propre ordinateur. Vous verrez le même problème mais pas les mêmes informations.</p><div class="role-grid">${g.roles.map((r,i)=>`<button class="role ${state.role===i?'selected':''}" data-role="${i}"><span class="check">${i===0?'🔎':'📜'}</span><strong>${esc(r.name)}</strong><span>${esc(r.detail)}</span></button>`).join('')}</div><div class="instructions">📣 <strong>Comment jouer à distance :</strong> ouvrez tous les deux ce même site, choisissez la même aventure et deux rôles différents. Mettez-vous en appel et démarrez ensemble. Chacun entre la réponse sur son écran pour débloquer l'étape suivante. Si l’un avance avant l’autre, il peut simplement attendre. Aucun indice de l’autre rôle n’est dévoilé.</div><button class="btn wide" id="begin" ${state.role===null?'disabled':''}>Je suis prêt(e) : commencer l'aventure →</button></section>`;document.querySelector('#back').onclick=home;document.querySelectorAll('[data-role]').forEach(b=>b.onclick=()=>{state.role=Number(b.dataset.role);safeSave();renderIntro()});document.querySelector('#begin').onclick=()=>{if(state.role===null)return;state.page='play';state.step=0;state.seconds=0;state.hints=0;state.feedback='';renderPlay();startClock()}}
function renderPlay(){let g=state.game,s=g.steps[state.step],role=g.roles[state.role];safeSave();app.innerHTML=`<header class="top"><div class="logo">✦ LES TROIS PORTES</div><span class="tag">${esc(g.title)}</span></header><div class="play-header"><div><div class="eyebrow">${esc(role.name)} · Mission en cours</div><div class="mini-title">${g.emoji} ${esc(g.title)}</div></div><div class="time" id="clock" aria-label="Temps écoulé">${fmt(state.seconds)}</div></div><div class="small">Énigme ${state.step+1} / ${g.steps.length} — ${Math.round(state.step/g.steps.length*100)} % terminé</div><div class="progress" aria-label="Progression"><div style="width:${state.step/g.steps.length*100}%"></div></div><div class="play-layout"><section class="panel story"><div class="step-count">Chapitre ${state.step+1} · ${esc(s.title)}</div><h2>${esc(s.title)}</h2><p>${esc(s.scene)}</p><p class="prompt">${esc(s.question)}</p><form id="form"><label class="sr" for="answer">Votre réponse</label><div class="answer"><input id="answer" type="text" autocomplete="off" autocapitalize="characters" spellcheck="false" placeholder="Votre code ou votre mot…" maxlength="40" required><button class="btn" type="submit">Valider ↗</button></div></form><div id="feedback" class="feedback" aria-live="polite"></div></section><aside class="aside"><section class="panel hint-box"><div class="eyebrow">${esc(role.name)} · Document confidentiel</div><div class="note"><div class="note-title">🔒 Votre indice privé</div><p>${esc(s.clues[state.role])}</p></div><p class="small">L'autre joueur voit un document différent. Décrivez-vous ce que vous voyez !</p><div class="hints" id="hints"></div></section><section class="panel hint-box"><div class="eyebrow">À garder en tête</div><p>Votre progression est <strong>locale à cet ordinateur</strong>. Vous devez entrer tous les deux la bonne réponse pour passer à la suite.</p><div class="tools"><button class="btn ghost" id="pause">⏸ Pause chrono</button><button class="btn ghost" id="exit">⌂ Accueil</button></div></section></aside></div><div class="footer">Temps conseillé : 3 à 5 min par énigme, plus les discussions. Les indices sont facultatifs. N'hésitez pas à utiliser papier et crayon !</div>`;document.querySelector('#form').onsubmit=(e)=>{e.preventDefault();const value=document.querySelector('#answer').value;if(clean(value)===clean(s.answer)){state.stopped=true;state.feedback='good';document.querySelector('#feedback').className='feedback good';document.querySelector('#feedback').textContent='✓ Bonne réponse ! '+s.reveal;document.querySelector('#form').innerHTML='<button class="btn wide" type="button" id="next">'+(state.step===g.steps.length-1?'Découvrir la fin ✨':'Continuer l’aventure →')+'</button>';document.querySelector('#next').onclick=()=>{state.step++;state.hints=0;state.stopped=false;if(state.step===g.steps.length)win();else{renderPlay();startClock()}}}else{document.querySelector('#feedback').className='feedback bad';document.querySelector('#feedback').textContent='Ce n’est pas encore le bon code. Recoupez vos deux documents !';document.querySelector('#answer').focus()}};document.querySelector('#pause').onclick=()=>{state.stopped=!state.stopped;document.querySelector('#pause').textContent=state.stopped?'▶ Reprendre chrono':'⏸ Pause chrono'};document.querySelector('#exit').onclick=()=>{if(confirm('Quitter cette aventure ? Votre progression ne sera pas conservée.'))home()};renderHints()}
function renderHints(){let el=document.querySelector('#hints');if(!el)return;let s=state.game.steps[state.step];el.innerHTML=`<div class="small">Besoin d’un coup de pouce ?</div>${state.hints>0?`<div class="hint-text">💡 ${esc(s.hint[0])}</div>`:''}${state.hints>1?`<div class="hint-text">💡 ${esc(s.hint[1])}</div>`:''}${state.hints<2?`<button class="btn secondary" id="hintBtn">${state.hints===0?'Afficher un indice':'Afficher un 2ᵉ indice'}</button>`:'<div class="small">Tous les indices sont dévoilés.</div>'}`;const b=document.querySelector('#hintBtn');if(b)b.onclick=()=>{state.hints++;renderHints()}}
function win(){clearInterval(ticker);state.page='win';safeSave();let g=state.game;const suffix=state.seconds>1800?'Une aventure pleine de rebondissements !':'Vous avez été plus rapides que l’horloge !';app.innerHTML=`<header class="top"><div class="logo">✦ LES TROIS PORTES</div></header><section class="win"><div class="panel"><div class="trophy">🏆</div><div class="eyebrow">Mission accomplie</div><h1>Vous vous êtes<br>échappés !</h1><p>Félicitations ! Vous avez terminé <strong>${esc(g.title)}</strong> en coopérant, en échangeant vos indices et en résolvant les sept énigmes.</p><div class="result">⏱ ${fmt(state.seconds)}</div><p>${suffix} Vous méritez bien le titre de duo de choc. 💛</p><div class="tools" style="justify-content:center;margin-top:24px"><button class="btn" id="again">Rejouer ce jeu</button><button class="btn secondary" id="other">Découvrir un autre univers</button></div></div></section>`;document.querySelector('#again').onclick=()=>intro(g);document.querySelector('#other').onclick=home}
home();
</script></body></html>
